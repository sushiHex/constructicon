name: Public text

# Detect private operator text (account names, host paths, addresses, host
# keys) in public issues, pull requests, comments, reviews and PR patches.
# Patterns live in the PUBLIC_TEXT_PATTERNS secret, never in the repository.
# pull_request_target runs this base-branch file and never checks out the head.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci/check_public_text.py
          sparse-checkout-cone-mode: false
      - name: Scan the event's public text
        shell: bash
        env:
          PUBLIC_TEXT_PATTERNS: ${{ secrets.PUBLIC_TEXT_PATTERNS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I -S -B scripts/ci/check_public_text.py "$GITHUB_EVENT_PATH"
