name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --dev
      - run: uv run verify
      - name: Export PR source for local integration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constructicon-m6-source
          include-hidden-files: true
          path: |
            src
            tests
            docs
            examples
            .github
            pyproject.toml
            uv.lock
            README.md
            AGENTS.md
            LICENSE
