name: verify

on:
  push:
    branches: [main]
  pull_request:

# Supersede only this workflow's runs for the same PR. Unique non-PR groups
# preserve pending as well as running main-branch evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-discovery:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - name: Prove the Windows argument boundary with fake Hyper-V cmdlets
        env:
          PYTHONIOENCODING: utf-8
        run: uv run pytest -q tests/test_m8_vm_address.py tests/test_m8_vm_usage.py tests/test_m8_discovery_procedure.py

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --dev
      # GitHub voids a workflow with one invalid key or expression and shows only
      # a jobless run, so lint every workflow before merge (#218). The release
      # checksum is from actionlint_1.7.12_checksums.txt in the v1.7.12 release.
      # The runner's shellcheck lints the run: blocks.
      - name: Lint workflows with actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -color -verbose -shellcheck="$(command -v shellcheck)"
      - name: Check maintenance diagnosis fixtures under UID 0
        run: |
          sudo -n -H env PYTHONPATH="$PWD/src" PYTHONIOENCODING=utf-8 "$PWD/.venv/bin/python" -c '
          import os
          import pytest
          assert os.getuid() == 0
          raise SystemExit(pytest.main(["-q", "tests/substrate/journal/test_maintenance_evidence.py", "tests/substrate/journal/test_maintenance_diagnostic.py"]))
          '
      - run: uv run verify
      - run: uv run python scripts/check_m8_host_artifact_mutations.py
      - name: Acquire and validate exact locked controller wheels
        run: uv run python -m scripts.ci.acquire_m8_controller_wheels "$RUNNER_TEMP/m8-controller-wheels"
      # Revalidate prepared bytes offline, then import the controller under the
      # host's interpreter version (M8-N4-host-runtime.md, controller addendum).
      - name: Prove offline controller imports under isolated Python
        env:
          M8_CONTROLLER_WHEELS: ${{ runner.temp }}/m8-controller-wheels
        run: M8_CONTROLLER_REQUIRED=1 uv run python -m pytest tests/test_m8_controller_env.py::test_the_staged_controller_imports_under_isolated_python -v -p no:cacheprovider
      - name: Check structural channels on Python 3.12
        env:
          UV_PROJECT_ENVIRONMENT: .venv312
        run: uv run --locked --python 3.12 pytest tests/api/test_channel_introspection.py -q

  # The portable mutation inventories, one job each, so one failure never hides
  # another. tests/test_mutation_inventories.py holds every inventory to exactly
  # one place in CI, and every mutant to live code.
  mutations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        inventory:
          - check_capability_accounting_mutations.py
          - check_capability_disposal_mutations.py
          - check_capability_provenance_mutations.py
          - check_claude_protocol_mutations.py
          - check_fault_coordinate_mutations.py
          - check_m71_mutations.py
          - check_m8_mutations.py
          - check_m8_native_operator_mutations.py
          - check_m8_procedure_package_mutations.py
          - check_m8_candidate_transfer_mutations.py
          - check_m8_host_baseline_mutations.py
          - check_m8_qualification_mutations.py
          - check_pi_read_mutations.py
          - check_pi_provider_mutations.py
          - check_public_text_mutations.py
          - check_registry_store_mutations.py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --dev
      - run: uv run python scripts/${{ matrix.inventory }}

  verify-complete:
    # A stable merge check for every portable job, including the entire matrix.
    # always() exposes failures instead of publishing a successful skipped job.
    if: always()
    needs: [windows-discovery, verify, mutations]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every portable job to succeed
        shell: bash
        env:
          WINDOWS_DISCOVERY: ${{ needs.windows-discovery.result }}
          VERIFY: ${{ needs.verify.result }}
          MUTATIONS: ${{ needs.mutations.result }}
        run: |
          set -euo pipefail
          test "$WINDOWS_DISCOVERY" = success
          test "$VERIFY" = success
          test "$MUTATIONS" = success
          printf '%s\n' 'all portable verification and mutation jobs succeeded'
