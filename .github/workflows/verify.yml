name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede only this workflow's runs for the same PR. Unique non-PR groups
# preserve pending as well as running main-branch evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select portable verification from the base revision
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          scope=full
          if [ "$EVENT" = pull_request ]; then
            # A PR cannot decide that its own checks are unnecessary.
            if git cat-file -e "$BASE_SHA:scripts/ci/m8_ci_scope.py"; then
              git show "$BASE_SHA:scripts/ci/m8_ci_scope.py" > "$RUNNER_TEMP/m8-ci-scope.py"
              scope=$(python3 "$RUNNER_TEMP/m8-ci-scope.py" classify --base "$BASE_SHA" --head "$HEAD_SHA")
            fi
          fi
          case "$scope" in docs|full) ;; *) exit 1 ;; esac
          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"
          printf 'Portable scope: **%s** (head `%s`).\n' "$scope" "$HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"

  docs:
    needs: classify
    if: needs.classify.outputs.scope == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/ci/m8_ci_scope.py docs

  windows-discovery:
    needs: classify
    if: needs.classify.outputs.scope == 'full'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - name: Prove the Windows argument boundary with fake Hyper-V cmdlets
        env:
          PYTHONIOENCODING: utf-8
        run: uv run pytest -q tests/test_m8_vm_address.py tests/test_m8_vm_usage.py tests/test_m8_discovery_procedure.py
      - name: Prove contributor fixtures on Windows Python 3.11
        env:
          PYTHONIOENCODING: utf-8
          UV_PROJECT_ENVIRONMENT: .venv311
        run: >-
          uv run --no-active --locked --python 3.11 python -m pytest
          tests/test_gitworld.py
          tests/test_portable_acquisition_namespace.py
          tests/substrate/test_pi_provider.py::test_materialized_task_reads_exact_workspace_and_closes_both_leases
          tests/api/test_pi_leases.py::test_scripted_read_counterfactual_simulates_effects_and_discards_both_leases
          -v

  verify:
    needs: classify
    if: needs.classify.outputs.scope == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --dev
      # GitHub voids a workflow with one invalid key or expression and shows only
      # a jobless run, so lint every workflow before merge (#218). The release
      # checksum is from actionlint_1.7.12_checksums.txt in the v1.7.12 release.
      # The runner's shellcheck lints the run: blocks.
      - name: Lint workflows with actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -color -verbose -shellcheck="$(command -v shellcheck)"
      - name: Check maintenance diagnosis fixtures under UID 0
        run: |
          sudo -n -H env PYTHONPATH="$PWD/src" PYTHONIOENCODING=utf-8 "$PWD/.venv/bin/python" -c '
          import os
          import pytest
          assert os.getuid() == 0
          raise SystemExit(pytest.main(["-q", "tests/substrate/journal/test_maintenance_evidence.py", "tests/substrate/journal/test_maintenance_diagnostic.py"]))
          '
      - run: uv run verify
      - run: uv run python scripts/check_m8_host_artifact_mutations.py
      - name: Acquire and validate exact locked controller wheels
        run: uv run python -m scripts.ci.acquire_m8_controller_wheels "$RUNNER_TEMP/m8-controller-wheels"
      # Revalidate prepared bytes offline, then import the controller under the
      # host's interpreter version (M8-N4-host-runtime.md, controller addendum).
      - name: Prove offline controller imports under isolated Python
        env:
          M8_CONTROLLER_WHEELS: ${{ runner.temp }}/m8-controller-wheels
        run: M8_CONTROLLER_REQUIRED=1 uv run python -m pytest tests/test_m8_controller_env.py::test_the_staged_controller_imports_under_isolated_python -v -p no:cacheprovider
      - name: Check structural channels on Python 3.12
        env:
          UV_PROJECT_ENVIRONMENT: .venv312
        run: uv run --locked --python 3.12 pytest tests/api/test_channel_introspection.py -q

  # The portable mutation inventories, one job each, so one failure never hides
  # another. tests/test_mutation_inventories.py holds every inventory to exactly
  # one place in CI, and every mutant to live code.
  mutations:
    needs: classify
    if: needs.classify.outputs.scope == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        inventory:
          - check_capability_accounting_mutations.py
          - check_capability_disposal_mutations.py
          - check_capability_provenance_mutations.py
          - check_claude_protocol_mutations.py
          - check_fault_coordinate_mutations.py
          - check_m71_mutations.py
          - check_m8_mutations.py
          - check_m8_native_operator_mutations.py
          - check_m8_noexec_mutations.py
          - check_m8_procedure_package_mutations.py
          - check_m8_candidate_transfer_mutations.py
          - check_m8_host_baseline_mutations.py
          - check_m8_qualification_mutations.py
          - check_pi_read_mutations.py
          - check_pi_provider_mutations.py
          - check_public_text_mutations.py
          - check_registry_store_mutations.py
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --dev
      - run: uv run python scripts/${{ matrix.inventory }}

  verify-complete:
    # Stable merge check: every selected job must succeed; only the unselected
    # set may be skipped. Missing classification or results fail closed.
    if: always()
    needs: [classify, docs, windows-discovery, verify, mutations]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the complete selected job result
        shell: bash
        env:
          CLASSIFICATION: ${{ needs.classify.result }}
          SCOPE: ${{ needs.classify.outputs.scope }}
          DOCS: ${{ needs.docs.result }}
          WINDOWS_DISCOVERY: ${{ needs.windows-discovery.result }}
          VERIFY: ${{ needs.verify.result }}
          MUTATIONS: ${{ needs.mutations.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFICATION" = success
          case "$SCOPE" in
            docs)
              test "$DOCS" = success
              test "$WINDOWS_DISCOVERY" = skipped
              test "$VERIFY" = skipped
              test "$MUTATIONS" = skipped
              ;;
            full)
              test "$DOCS" = skipped
              test "$WINDOWS_DISCOVERY" = success
              test "$VERIFY" = success
              test "$MUTATIONS" = success
              ;;
            *) exit 1 ;;
          esac
          printf '%s\n' 'all selected portable jobs succeeded'
