name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --dev
      - run: uv run verify
      - run: uv run python scripts/check_m8_host_artifact_mutations.py
      # The controller tree from the locked wheels, imported under the host's
      # interpreter version (M8-N4-host-runtime.md, controller addendum).
      - run: M8_CONTROLLER_REQUIRED=1 uv run python -m pytest tests/test_m8_controller_env.py::test_the_staged_controller_imports_under_isolated_python -v -p no:cacheprovider

  # The portable mutation inventories, one job each, so one failure never hides
  # another. tests/test_mutation_inventories.py holds every inventory to exactly
  # one place in CI, and every mutant to live code.
  mutations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        inventory:
          - check_fault_coordinate_mutations.py
          - check_m71_mutations.py
          - check_m8_mutations.py
          - check_m8_native_operator_mutations.py
          - check_m8_qualification_mutations.py
          - check_registry_store_mutations.py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --dev
      - run: uv run python scripts/${{ matrix.inventory }}
