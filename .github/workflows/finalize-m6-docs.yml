name: finalize M6 architecture and cleanup

on:
  push:
    branches:
      - codex/m6-durable-control-plane
    paths:
      - .github/workflows/finalize-m6-docs.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/m6-durable-control-plane
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Finalize architecture, remove scaffolding, verify
        run: |
          python - <<'PY'
          from pathlib import Path

          architecture = Path("docs/ARCHITECTURE.md")
          text = architecture.read_text()

          old_layer = '''L4  api        system object · typed describe/admission · MCP server (M6) ·
               CLI skin · injection root: constructs L1, hands it to L2
'''
          new_layer = '''L4  api        system object · typed describe/admission · durable ControlPlane ·
               RunHost · cursor/detail projections · optional MCP adapter ·
               CLI skin · injection root: constructs L1, hands it to L2
'''
          if old_layer not in text:
              raise SystemExit("L4 architecture marker not found")
          text = text.replace(old_layer, new_layer, 1)

          identity_marker = "## Identity\n"
          control_section = '''## Durable control plane and MCP adapter

M6 adds a transport-neutral `ControlPlane`; MCP is its first adapter, not the
owner of control semantics. Four nouns describe the control surface:

```text
Actor       who is asking
Command     one durable mutation intent
Run         long-lived work
Reference   bounded access to immutable detail
```

Every mutation follows one law:

```text
Authorize
→ canonicalize request
→ claim command
→ store immutable plan
→ apply or reconcile one domain mutation
→ store the exact terminal response
→ return
```

The command identity binds authenticated actor, operation, caller idempotency
key, and canonical request hash. Identical terminal retries replay the stored
response; key reuse with different arguments is a typed conflict; a prepared
command with an expired owner is reclaimed at a higher epoch and reconciled from
its durable domain fact. Fault injection proves all three loss seams: after plan
commit, after domain mutation, and after command completion.

`RunId` remains the one identity for long-lived work. `RunHost` owns only
process-local worker coroutines, a run-level concurrency ceiling, and recovery of
PENDING or lost RUNNING runs; the walker remains the sole graph scheduler.
Server shutdown abandons hosted work without recording user cancellation, leaving
the durable run resumable. Only `runs_cancel` records cancellation intent.

Counterfactual runs are contract-compatible replays of a source manifest. Every
non-overridden scope remains source-exact; overrides name exact retained versions
and must preserve the affected source contracts. Effects use a separate simulated
idempotency namespace and adapter-owned `simulate()` methods — never `execute()`
or `reconcile()` — and mutable capabilities close with `discard`. Parent run,
overrides, effect mode, and capability mode are durable `RunOrigin` data.

Read operations return bounded pages with opaque, checksum-protected cursors bound
to actor, endpoint, filters, and snapshot upper bound. Full immutable detail is
available through one `constructicon://` reference vocabulary and chunked without
altering the authoritative value.

The optional MCP v2 package lives only under `constructicon.api.mcp`. Stdio uses
a fixed actor supplied by the trusted launching process. Streamable HTTP is
authenticated or unavailable and derives its actor from a verified OAuth access
token. An MCP handler derives the actor, delegates once to `ControlPlane`, and
returns the typed result; it never opens SQLite, computes a `RunId`, interprets a
cursor, or reconciles a command. See
[adr/0012](adr/0012-durable-control-plane-and-mcp.md).

'''
          if identity_marker not in text:
              raise SystemExit("identity section marker not found")
          text = text.replace(identity_marker, control_section + identity_marker, 1)

          old_journal = '''One transactional log, many projections. SQLite (stdlib, WAL) is authoritative
for runs, events (per-run monotonic sequence), checkpoints, attestations, and
effect records; node completion commits checkpoint + event in one transaction.
'''
          new_journal = '''One transactional log, many projections. SQLite (stdlib, WAL) is authoritative
for runs, origins, events (per-run monotonic sequence), checkpoints, commands,
approvals, attestations, and effect records; node completion commits checkpoint +
event in one transaction, while command completion stores the exact replayable
control response.
'''
          if old_journal not in text:
              raise SystemExit("journal paragraph marker not found")
          text = text.replace(old_journal, new_journal, 1)

          old_m6 = "- **M6** — MCP control plane with idempotency keys and bounded pagination.\n"
          new_m6 = '''- **M6 (done)** — authenticated actors; one fenced command ledger for every
  mutation; immutable plans and exact response replay; immediate `RunId`
  submission through `RunHost`; bounded run/registry pages with stable actor-bound
  cursors and detail references; approval, baseline-aware promotion and
  expected-stable rollback; contract-compatible counterfactual replay with
  simulated effects and discard-only capabilities; optional MCP v2 adapter over
  stdio and OAuth-protected Streamable HTTP. See
  [adr/0012](adr/0012-durable-control-plane-and-mcp.md).
'''
          if old_m6 not in text:
              raise SystemExit("M6 milestone marker not found")
          text = text.replace(old_m6, new_m6, 1)

          failure_marker = "| MCP | Retried mutation with the same idempotency key → one run (M6) |\n"
          failure_rows = '''| MCP | Retried mutation with the same actor/key/request → one stored response and one domain fact (M6) |
| Control commands | Crash after plan, domain mutation, or command completion → reclaim/reconcile/replay, never duplicate (M6) |
| Counterfactual | Invalid or contract-changing override refused before a run; valid replay invokes zero live effects (M6) |
| Control identity | Tool arguments cannot claim actors; stdio actor is launcher-supplied and HTTP actor is token-derived (M6) |
| Pagination | Cursor reuse by another actor or changed query is refused; later inserts do not enter an existing snapshot (M6) |
'''
          if failure_marker not in text:
              raise SystemExit("MCP failure-table marker not found")
          text = text.replace(failure_marker, failure_rows, 1)
          architecture.write_text(text)

          verify = Path(".github/workflows/verify.yml")
          verify_text = verify.read_text()
          export_marker = "      - name: Export PR source for local integration\n"
          if export_marker in verify_text:
              verify_text = verify_text.split(export_marker, 1)[0].rstrip() + "\n"
              verify.write_text(verify_text)
          PY

          rm -rf .m6-docs .github/workflows/apply-m6-docs.yml
          uv sync --dev
          uv run verify
          git add docs/ARCHITECTURE.md .github/workflows/verify.yml
          git rm --ignore-unmatch -r .m6-docs .github/workflows/apply-m6-docs.yml
          git rm .github/workflows/finalize-m6-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: finalize M6 architecture and remove integration scaffolding"
          git push origin HEAD:codex/m6-durable-control-plane
