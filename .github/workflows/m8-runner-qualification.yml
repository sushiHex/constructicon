name: M8 runner qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m8-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Provision disposable runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          sudo apt-get -q update
          sudo apt-get -q -y install --no-install-recommends bubblewrap=0.9.0-1ubuntu0.1
          sudo useradd --create-home --shell /bin/sh m8-probe
          sudo install -d -m 0755 /opt/constructicon-m8-qualification
          sudo install -m 0444 scripts/ci/qualify_m8_runner.py /opt/constructicon-m8-qualification/probe.py
          sudo install -m 0555 /usr/bin/bwrap /opt/constructicon-m8-qualification/bwrap
      - name: Inspect packaged and loaded bubblewrap policy
        shell: bash
        run: |
          set -euo pipefail
          dpkg-query -W -f='${Package} ${Version}\n' apparmor bubblewrap
          find /etc/apparmor.d -maxdepth 2 -iname '*bwrap*' -print
          sudo cat /sys/kernel/security/apparmor/profiles | awk '/bwrap/ {print; count++; if (count == 32) exit}'
      - name: Load the reviewed qualification profile
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          sudo install -m 0444 scripts/ci/constructicon-m8-bwrap.apparmor /etc/apparmor.d/constructicon-m8-bwrap
          sudo apparmor_parser --add --skip-cache /etc/apparmor.d/constructicon-m8-bwrap
          sudo cat /sys/kernel/security/apparmor/profiles | awk '/constructicon-m8-/ {print}'
      - name: Qualify as an unprivileged service user
        shell: bash
        env:
          EVIDENCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          sudo -u m8-probe env -i PATH=/usr/bin:/bin HOME=/home/m8-probe LANG=C.UTF-8 \
            /usr/bin/python3 /opt/constructicon-m8-qualification/probe.py \
            --commit "$EVIDENCE_COMMIT" --image "$ImageOS/$ImageVersion" \
            | tee "$RUNNER_TEMP/m8-qualification.json"
      - name: Report qualification profile denials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo dmesg --color=never | awk '/apparmor="DENIED"/ && /constructicon-m8-/ {if (count++ < 32) print}'
      - name: Preserve bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m8-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m8-qualification.json
          if-no-files-found: error
          retention-days: 7
