name: apply M6 control patch

on:
  push:
    branches:
      - codex/m6-durable-control-plane
    paths:
      - .github/workflows/apply-m6-control-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/m6-durable-control-plane
          fetch-depth: 0
      - name: Apply compressed patch
        run: |
          cat .m6-apply/part* | base64 --decode | gzip --decompress > /tmp/m6.patch
          git apply --index /tmp/m6.patch
          git rm -r .m6-apply .github/workflows/apply-m6-control-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "M6: add durable ControlPlane and RunHost"
          git push origin HEAD:codex/m6-durable-control-plane
