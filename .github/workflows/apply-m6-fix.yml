name: apply M6 CI fixes

on:
  push:
    branches:
      - codex/m6-durable-control-plane
    paths:
      - .github/workflows/apply-m6-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/m6-durable-control-plane
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Apply and verify fixes
        run: |
          cat .m6-fix/part* | base64 --decode | gzip --decompress > /tmp/m6-fix.patch
          git apply --index /tmp/m6-fix.patch
          uv sync --dev
          uv run ruff check --fix tests/api/test_control_commands.py
          git add tests/api/test_control_commands.py
          uv run verify
          git rm -r .m6-fix .github/workflows/apply-m6-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "M6: harden ControlPlane typing and replay semantics"
          git push origin HEAD:codex/m6-durable-control-plane
