name: apply M6.1 hardening

on:
  push:
    branches:
      - fix/m6-1-authority-and-green-main
    paths:
      - .github/workflows/apply-m6-1.yml

permissions:
  contents: write

concurrency:
  group: apply-m6-1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m6-1-authority-and-green-main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Build one clean M6.1 commit from current main
        run: |
          cat .m6-1/parts/part* > /tmp/m6-1.patch.gz.b64
          base64 --decode /tmp/m6-1.patch.gz.b64 | gzip --decompress > /tmp/m6-1.patch
          echo "c820f23f1409d208ba6a085e4d6e88c8c994b83d201e85d5bc28ad17ced8110f  /tmp/m6-1.patch" | sha256sum --check

          git fetch origin main
          git reset --hard origin/main
          git apply --index /tmp/m6-1.patch

          test ! -e .m6-1
          test ! -e .m6-docs
          test ! -e .github/workflows/apply-m6-1.yml
          test ! -e .github/workflows/apply-m6-docs.yml
          test ! -e .github/workflows/finalize-m6-docs.yml
          ! grep -q "Export PR source" .github/workflows/verify.yml

          uv sync --dev
          uv run verify

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "M6.1: harden control authority and command recovery"
          git push --force-with-lease origin HEAD:fix/m6-1-authority-and-green-main
