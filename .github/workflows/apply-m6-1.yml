name: apply M6.1 hardening

on:
  push:
    branches:
      - fix/m6-1-authority-and-green-main
    paths:
      - .github/workflows/apply-m6-1.yml

permissions:
  contents: write

concurrency:
  group: apply-m6-1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m6-1-authority-and-green-main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Apply, verify, and remove one-shot integration files
        run: |
          base64 --decode .m6-1/apply.patch.gz.b64 | gzip --decompress > /tmp/m6-1.patch
          echo "c820f23f1409d208ba6a085e4d6e88c8c994b83d201e85d5bc28ad17ced8110f  /tmp/m6-1.patch" | sha256sum --check
          git apply --index /tmp/m6-1.patch
          git rm -r .m6-1 .github/workflows/apply-m6-1.yml
          uv sync --dev
          uv run verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "M6.1: harden authority, immutable detail, and command recovery"
          git push origin HEAD:fix/m6-1-authority-and-green-main
