name: apply M6 documentation

on:
  push:
    branches:
      - codex/m6-durable-control-plane
    paths:
      - .github/workflows/apply-m6-docs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/m6-durable-control-plane
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Apply and verify M6 docs
        run: |
          cat .m6-docs/part* | base64 --decode | gzip --decompress > /tmp/m6-docs.patch
          git apply --index /tmp/m6-docs.patch
          uv sync --dev
          uv run verify
          git rm -r .m6-docs .github/workflows/apply-m6-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: mark M6 durable control plane complete"
          git push origin HEAD:codex/m6-durable-control-plane
