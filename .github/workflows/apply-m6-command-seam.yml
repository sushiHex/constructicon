name: apply M6 command completion seam

on:
  push:
    branches:
      - codex/m6-durable-control-plane
    paths:
      - .github/workflows/apply-m6-command-seam.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/m6-durable-control-plane
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Add universal post-completion fault seam
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/constructicon/api/control.py")
          text = path.read_text()
          old = 'self.store.complete_command(claim, response.model_dump(mode="json"))'
          observed = text.count(old)
          if observed != 7:
              raise SystemExit(f"expected 7 command completion sites, found {observed}")
          text = text.replace(old, "self._complete_command(claim, response)")
          marker = "    def _begin_command(\n"
          helper = '''    def _complete_command(self, claim: CommandClaim, response: BaseModel) -> None:\n        self.store.complete_command(claim, response.model_dump(mode="json"))\n        self.fault_probe(f"{claim.operation}.after_command_completion")\n\n'''
          if marker not in text:
              raise SystemExit("command-law insertion marker not found")
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)
          PY
          uv sync --dev
          uv run ruff check --fix src/constructicon/api/control.py
          git add src/constructicon/api/control.py
          uv run verify
          git rm .github/workflows/apply-m6-command-seam.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "M6: add universal post-command completion fault seam"
          git push origin HEAD:codex/m6-durable-control-plane
