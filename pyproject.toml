[project]
name = "constructicon"
version = "0.1.0"
description = "An OS for agentic software-engineering pipelines: one graph IR, sealed execution manifests, proof-carrying effects."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.7",
]

[project.scripts]
verify = "constructicon._verify:main"
constructicon-mcp = "constructicon.api.mcp.__main__:main"

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "import-linter>=2.0",
    "mcp>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/constructicon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/constructicon"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The adapter revision is intentionally attached as function metadata; using
# setattr here is the truthful cross-layer observation point, not dynamic API
# dispatch. Runtime reads it without importing the SDK.
"src/constructicon/sdk/task.py" = ["B010"]

[tool.importlinter]
root_package = "constructicon"
include_external_packages = true

# I8: dependencies point at contracts, strictly downward.
[[tool.importlinter.contracts]]
name = "Layer contract: core <- substrate | runtime <- sdk <- api"
type = "layers"
layers = [
    "constructicon.api",
    "constructicon.sdk",
    "constructicon.runtime",
    "constructicon.substrate",
    "constructicon.core",
]

# L2 depends on L0 contracts only, never concrete substrate modules;
# L4 assembles and injects L1 implementations.
[[tool.importlinter.contracts]]
name = "Runtime never imports substrate"
type = "forbidden"
source_modules = ["constructicon.runtime"]
forbidden_modules = ["constructicon.substrate"]

# MCP is an optional L4 transport. No other package may import it.
# The api entries are every child of constructicon.api except mcp itself;
# tests/test_layer_contracts.py derives that set from the package directory.
[[tool.importlinter.contracts]]
name = "Only the MCP adapter imports mcp"
type = "forbidden"
source_modules = [
    "constructicon.core",
    "constructicon.substrate",
    "constructicon.runtime",
    "constructicon.sdk",
    "constructicon.api._claude_read_fixture",
    "constructicon.api._control_commands",
    "constructicon.api._control_queries",
    "constructicon.api._m9",
    "constructicon.api._maintenance_identity",
    "constructicon.api._maintenance_source",
    "constructicon.api._metered_native",
    "constructicon.api._qualification_write_assembly",
    "constructicon.api._qualification_write_graph",
    "constructicon.api._qualification_write_report",
    "constructicon.api.claude_qualification",
    "constructicon.api.claude_write_qualification",
    "constructicon.api.control",
    "constructicon.api.cursor",
    "constructicon.api.detail",
    "constructicon.api.introspection",
    "constructicon.api.m9_trial",
    "constructicon.api.maintenance_entry",
    "constructicon.api.maintenance_report",
    "constructicon.api.plan_manifest_application",
    "constructicon.api.qualification",
    "constructicon.api.run_host",
    "constructicon.api.system",
]
forbidden_modules = ["mcp"]

# M8 N5 Stage 1: no fixed-task entry is a caller-selectable surface. The MCP
# adapter may reach only the control surface (control, system and what they
# import); every other child of constructicon.api is forbidden here, so a new
# module is refused until tests/test_layer_contracts.py admits it by name.
[[tool.importlinter.contracts]]
name = "The MCP adapter never reaches the qualification entry"
type = "forbidden"
source_modules = ["constructicon.api.mcp"]
forbidden_modules = [
    "constructicon.api._claude_read_fixture",
    "constructicon.api._m9",
    "constructicon.api._maintenance_identity",
    "constructicon.api._maintenance_source",
    "constructicon.api._qualification_write_assembly",
    "constructicon.api._qualification_write_graph",
    "constructicon.api._qualification_write_report",
    "constructicon.api.claude_qualification",
    "constructicon.api.claude_write_qualification",
    "constructicon.api.m9_trial",
    "constructicon.api.maintenance_entry",
    "constructicon.api.maintenance_report",
    "constructicon.api.plan_manifest_application",
    "constructicon.api.qualification",
]

# Dependency budget: the kernel imports stdlib + pydantic only.
[[tool.importlinter.contracts]]
name = "Kernel dependency budget"
type = "forbidden"
source_modules = [
    "constructicon.core",
    "constructicon.substrate",
    "constructicon.runtime",
]
forbidden_modules = ["mcp", "opentelemetry", "yaml", "requests", "httpx"]
